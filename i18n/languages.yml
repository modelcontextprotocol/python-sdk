# One entry per translated site. English is the source at docs/.
model: claude-opus-5 # public model id; used for every translation call
exclude: [migration.md] # nav pages never translated (exact path or "dir/**")
languages:
  - code: zh-CN # directory under i18n/ and URL prefix /zh-CN/
    name: 简体中文 # switcher label
    theme: zh # theme `language` (UI strings, search)
    hreflang: zh-Hans # announced in <link rel="alternate">
  - code: ja
    name: 日本語
    theme: ja
    hreflang: ja
  - code: ko
    name: 한국어
    theme: ko
    hreflang: ko
  - code: pt-BR
    name: Português (Brasil)
    theme: pt-BR
    hreflang: pt-BR
