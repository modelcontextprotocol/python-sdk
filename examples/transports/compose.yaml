services:
  amqp:
    image: rabbitmq:4.1.8-alpine@sha256:1a087dd3a29b91448407409df70f4f6cb213ac0c269a62861bfe2a665f4ced03
    ports:
      - "127.0.0.1:${AMQP_TEST_PORT:-15672}:5672"
    volumes:
      - ./brokers/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./brokers/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 2s
      timeout: 5s
      retries: 30
  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
    ports:
      - "127.0.0.1:${MQTT_TEST_PORT:-13883}:1883"
    volumes:
      - ./brokers/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./brokers/mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mosquitto_passwd -b -c /tmp/passwords server test-server-password
        mosquitto_passwd -b /tmp/passwords alice test-alice-password
        mosquitto_passwd -b /tmp/passwords bob test-bob-password
        chmod 644 /tmp/passwords
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "127.0.0.1",
          "-u",
          "server",
          "-P",
          "test-server-password",
          "-t",
          "mcp/alice/health/responses",
          "-m",
          "",
          "-q",
          "2",
        ]
      interval: 1s
      timeout: 3s
      retries: 20
